name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild \
            -project FaithMap.xcodeproj \
            -scheme FaithMap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/FaithMap.xcarchive \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath $PWD/build/FaithMap.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FaithMap-ipa
          path: build/ipa/*.ipa
