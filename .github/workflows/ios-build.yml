name: iOS Build


on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer


      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}


      - name: Install provisioning profile
        env:
          PROV_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/FaithMap.mobileprovision


      - name: Build
        run: |
          xcodebuild \
            -project FaithMap.xcodeproj \
            -scheme FaithMap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/FaithMap.xcarchive \
            archive


      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath $PWD/build/FaithMap.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build/ipa


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FaithMap-ipa
          path: build/ipa/*.ipa


      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'build/ipa/FaithMap.ipa'
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
