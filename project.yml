name: FaithMap
options:
  bundleIdPrefix: app.havenmedia.faithmap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: A4Q956A834
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"

targets:
  FaithMap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FaithMap
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.havenmedia.faithmap
        PRODUCT_NAME: FaithMap
        INFOPLIST_FILE: FaithMap/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: "Faith Map App Store"
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: FaithMapWidget

  FaithMapWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FaithMapWidget
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.havenmedia.faithmap.FaithMapWidget
        PRODUCT_NAME: FaithMapWidget
        INFOPLIST_FILE: FaithMapWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

schemes:
  FaithMap:
    build:
      targets:
        FaithMap: all
        FaithMapWidget: all
    run:
      config: Debug
    archive:
      config: Release
